name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build --parallel

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q tests/unit

  integration:
    needs:
      - build
      - unit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create artifact directories
        run: mkdir -p artifacts/ci

      - name: Start integration environment
        run: docker compose --profile test up --build --abort-on-container-exit --exit-code-from integration-test integration-test

      - name: Collect integration logs
        if: always()
        run: docker compose logs --no-color > artifacts/ci/integration-compose.log || true

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: artifacts/ci/
          if-no-files-found: warn

      - name: Tear down integration environment
        if: always()
        run: docker compose down -v --remove-orphans

  e2e:
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create artifact directories
        run: mkdir -p artifacts/ci

      - name: Start E2E environment
        run: docker compose --profile test up --build --abort-on-container-exit --exit-code-from e2e-test e2e-test

      - name: Collect E2E logs
        if: always()
        run: docker compose logs --no-color > artifacts/ci/e2e-compose.log || true

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: artifacts/ci/
          if-no-files-found: warn

      - name: Tear down E2E environment
        if: always()
        run: docker compose down -v --remove-orphans

  load:
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Create artifact directories
        run: mkdir -p artifacts/ci artifacts/load

      - name: Start full stack
        run: PRODUCER_ENABLE_GENERATOR=false docker compose up -d --build

      - name: Run load test and collect Prometheus metrics
        run: bash scripts/ci/run_load_and_collect.sh

      - name: Capture compose logs
        if: always()
        run: docker compose logs --no-color > artifacts/ci/docker-compose.log || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hw7-observability-artifacts
          path: artifacts/
          if-no-files-found: warn

      - name: Tear down full stack
        if: always()
        run: docker compose down -v --remove-orphans
