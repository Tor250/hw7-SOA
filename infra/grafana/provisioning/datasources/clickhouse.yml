apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: ClickHouse
    uid: clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    editable: false
    isDefault: false
    jsonData:
      defaultDatabase: analytics
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      username: analytics
    secureJsonData:
      password: "analytics"
